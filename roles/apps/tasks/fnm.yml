---
- name: Add fnm exec to .zshrc
  ansible.builtin.blockinfile:
    path: "~/.zshrc"
    marker: "# {mark} FNM"
    append_newline: true
    prepend_newline: true
    block: |
      eval "$(fnm env --use-on-cd --shell zsh)"

