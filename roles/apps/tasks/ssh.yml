---
- name: "Setup SSH dir"
  ansible.builtin.file:
    path: "~/.ssh"
    mode: 0700
    state: directory

- name: "Check SSH private file exists"
  stat:
    path: "~/.ssh/{{ ssh.identity }}"
  register: private_stat_result

- name: "Download SSH keys"
  when: private_stat_result.stat.exists == false
  block:
    - name: "Write SSH private key to file"
      copy:
        dest: "~/.ssh/{{ ssh.identity }}"
        mode: 0600
        content: >
          {{ lookup('community.general.bitwarden', ssh.bw_key, field=ssh.bw_field, bw_session=bw_session)[0] }}

    - name: "Write SSH public key to file"
      copy:
        dest: "~/.ssh/{{ ssh.identity }}.pub"
        mode: 0644
        content: >
          {{ lookup('community.general.bitwarden', ssh.bw_key, field='login', bw_session=bw_session)[0].username }}

- name: "Include the managed SSH settings"
  ansible.builtin.lineinfile:
    path: "~/.ssh/config"
    line: "Include {{ ansible_facts.env.HOME }}/.ssh/playbook.conf"
    insertbefore: BOF
    create: true
    mode: "0644"

- name: "Write the managed SSH settings"
  ansible.builtin.copy:
    content: |
      # Managed by the mac-playbook; edit the playbook instead of this file.
      Host *
          AddKeysToAgent yes
          UseKeychain yes
          IdentityFile ~/.ssh/{{ ssh.identity }}
      {% for name, host in ssh.hosts.items() %}

      Host {{ name }}
          HostName {{ name }}.{{ tailnet.domain }}
          User {{ host.remote_user }}
      {% if host.port is defined %}
          Port {{ host.port }}
      {% endif %}
      {% endfor %}
    dest: "~/.ssh/playbook.conf"
    mode: "0644"

- name: "Register SSH identity"
  block:
    - name: "List identities"
      shell: >-
        ssh-add -L
      failed_when: false
      register: ssh_list_result
      changed_when: false

    - name: "Add identity to ssh agent"
      when: ssh_list_result.rc != 0
      shell: >-
        ssh-add --apple-use-keychain ~/.ssh/{{ ssh.identity }}

- name: Add Github server to known_hosts
  ansible.builtin.known_hosts:
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com 2>/dev/null | grep -v ^#') }}"
