---
- name: Install Happ from the App Store
  ansible.builtin.command: mas install 6504287215
  register: happ_install
  environment:
    MAS_NO_AUTO_INDEX: "1"
  changed_when: happ_install.rc == 0 and "already installed" not in ((happ_install.stdout ~ happ_install.stderr) | lower)
  failed_when: false

- name: Check Happ is installed
  ansible.builtin.stat:
    path: /Applications/Happ.app
  register: happ_app

- name: Fail when the App Store did not install Happ
  ansible.builtin.fail:
    msg: >-
      Happ is not installed. Open the App Store once, sign in, and accept its
      welcome dialog, then re-run the playbook.
      mas said: {{ (happ_install.stderr | default('')).splitlines() | last | default('no output') }}
  when: not happ_app.stat.exists

- name: Check whether the Happ subscription was added
  ansible.builtin.stat:
    path: "{{ happ.config_dir }}/subscription-added"
  register: happ_subscription_added

- name: Add the Happ subscription
  when:
    - happ_app.stat.exists
    - not happ_subscription_added.stat.exists
  vars:
    subscription_url: "{{ lookup('community.general.bitwarden', happ.bw_key, field='password', bw_session=bw_session)[0] }}"
  block:
    - name: Ensure the Happ config dir exists
      ansible.builtin.file:
        path: "{{ happ.config_dir }}"
        state: directory
        mode: "0755"

    - name: Register the Happ app with LaunchServices
      ansible.builtin.command:
        argv:
          - /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          - -f
          - /Applications/Happ.app
      changed_when: false

    - name: Open the Happ subscription link
      ansible.builtin.command:
        argv:
          - open
          - "happ://add/{{ subscription_url | urlencode | replace('/', '%2F') }}"
      no_log: true

    - name: Remember the subscription was added
      ansible.builtin.copy:
        content: "{{ subscription_url | hash('sha256') }}\n"
        dest: "{{ happ.config_dir }}/subscription-added"
        mode: "0600"
      no_log: true
