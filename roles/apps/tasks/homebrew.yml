---
- name: Add homebrew path to .zshenv
  ansible.builtin.blockinfile:
    path: "~/.zshenv"
    marker: "# {mark} Homebrew"
    prepend_newline: true
    append_newline: true
    block: |
      # Adding Homebrew to PATH
      export PATH=/opt/homebrew/bin:$PATH

- name: Add homebrew shellenv command to .zprofile
  ansible.builtin.blockinfile:
    path: "~/.zprofile"
    marker: "# {mark} Homebrew"
    prepend_newline: true
    append_newline: true
    block: |
      # https://github.com/Homebrew/brew/blob/master/Library/Homebrew/cmd/shellenv.sh
      eval "$(brew shellenv)"

- name: Read the brew autoupdate settings
  ansible.builtin.command: brew autoupdate status
  register: brew_autoupdate
  changed_when: false
  failed_when: false

- name: Start brew autoupdate
  ansible.builtin.command: >
    brew autoupdate start 12h --upgrade --cleanup --sudo --ac-only
  when: brew_autoupdate.rc != 0