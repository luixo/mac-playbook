---
- name: Install Xcode from the App Store
  ansible.builtin.command: "{{ mas_command }} install 497799835"
  register: xcode_install
  environment:
    MAS_NO_AUTO_INDEX: "1"
  become: true
  changed_when: xcode_install.rc == 0 and "already installed" not in ((xcode_install.stdout ~ xcode_install.stderr) | lower)
  failed_when: false

- name: Check Xcode is installed
  ansible.builtin.stat:
    path: /Applications/Xcode.app
  register: xcode_app

# mas succeeds even when the App Store cannot install anything, so the app on
# disk is the only reliable answer.
- name: Fail when the App Store did not install Xcode
  ansible.builtin.fail:
    msg: >-
      Xcode is not installed. Open the App Store once, sign in, and accept its
      welcome dialog, then re-run the playbook.
      mas said: {{ (xcode_install.stderr | default('')).splitlines() | last | default('no output') }}
  when: not xcode_app.stat.exists

- name: Point the command line tools at Xcode
  ansible.builtin.command: xcode-select -s /Applications/Xcode.app
  become: true
  changed_when: false
  when: xcode_app.stat.exists

- name: Accept the Xcode license
  ansible.builtin.command: xcodebuild -license accept
  become: true
  changed_when: false
  when: xcode_app.stat.exists

- name: Install the first-launch Xcode components
  ansible.builtin.command: xcodebuild -runFirstLaunch
  become: true
  changed_when: false
  when: xcode_app.stat.exists

- name: List installed simulator runtimes
  ansible.builtin.command: xcrun simctl list runtimes
  register: simulator_runtimes
  changed_when: false
  when: xcode_app.stat.exists

- name: Download the iOS simulator runtime
  ansible.builtin.command: xcodebuild -downloadPlatform iOS
  become: true
  when:
    - xcode_app.stat.exists
    - "'iOS' not in simulator_runtimes.stdout"
