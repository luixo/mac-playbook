- name: "Finder: disable extension change warning"
  osx_defaults:
    domain: "com.apple.finder"
    key: "FXEnableExtensionChangeWarning"
    type: bool
    value: false

- name: "Finder: new window target as home directory"
  osx_defaults:
    domain: "com.apple.finder"
    key: "NewWindowTarget"
    type: string
    value: "PfHm"

- name: "Finder: show desktop icons for external drives"
  osx_defaults:
    domain: "com.apple.finder"
    key: "ShowExternalHardDrivesOnDesktop"
    type: bool
    value: true

- name: "Finder: show desktop icons for removable media"
  osx_defaults:
    domain: "com.apple.finder"
    key: "ShowRemovableMediaOnDesktop"
    type: bool
    value: true

- name: "Finder: show path bar"
  osx_defaults:
    domain: "com.apple.finder"
    key: "ShowPathbar"
    type: bool
    value: true

- name: "Finder: show status bar"
  osx_defaults:
    domain: "com.apple.finder"
    key: "ShowStatusBar"
    type: bool
    value: true

- name: "Finder: hide recent tags from sidebar"
  osx_defaults:
    domain: "com.apple.finder"
    key: "ShowRecentTags"
    type: bool
    value: false

- name: "Finder: show all extensions"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "AppleShowAllExtensions"
    type: bool
    value: true

- name: "Finder: show all files"
  osx_defaults:
    domain: "com.apple.Finder"
    key: "AppleShowAllFiles"
    type: bool
    value: true

- name: "Finder: read snap to grid setting"
  ansible.builtin.command:
    argv:
      - /usr/libexec/PlistBuddy
      - -c
      - "Print :StandardViewSettings:IconViewSettings:arrangeBy"
      - "{{ ansible_facts.env.HOME }}/Library/Preferences/com.apple.Finder.plist"
  register: finder_arrange_by
  changed_when: false
  failed_when: false

- name: "Finder: snap to grid"
  ansible.builtin.command:
    argv:
      - /usr/libexec/PlistBuddy
      - -c
      - "Set :StandardViewSettings:IconViewSettings:arrangeBy name"
      - "{{ ansible_facts.env.HOME }}/Library/Preferences/com.apple.Finder.plist"
  when: finder_arrange_by.stdout | trim != "name"

