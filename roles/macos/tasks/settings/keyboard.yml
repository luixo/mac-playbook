- name: "Keyboard: check the input source list"
  ansible.builtin.shell: |
    /usr/bin/python3 - "$HOME/Library/Preferences/com.apple.HIToolbox.plist" '{{ keyboard.input_sources | to_json }}' <<'PY'
    import json, plistlib, sys

    with open(sys.argv[1], "rb") as plist:
        current = plistlib.load(plist).get("AppleEnabledInputSources")
    sys.exit(0 if current == json.loads(sys.argv[2]) else 1)
    PY
  register: keyboard_input_sources
  changed_when: false
  failed_when: false

- name: "Keyboard: remove all keyboards"
  ansible.builtin.shell: |
    set -e
    plist="$HOME/Library/Preferences/com.apple.HIToolbox.plist"
    /usr/libexec/PlistBuddy -c "Delete :AppleEnabledInputSources" "$plist" 2>/dev/null || true
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources array" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources: dict" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:0:InputSourceKind string 'Keyboard Layout'" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:0:'KeyboardLayout ID' integer 252" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:0:'KeyboardLayout Name' string ABC" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources: dict" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:1:InputSourceKind string 'Keyboard Layout'" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:1:'KeyboardLayout ID' integer 19458" "$plist"
    /usr/libexec/PlistBuddy -c "Add :AppleEnabledInputSources:1:'KeyboardLayout Name' string RussianWin" "$plist"
  args:
    executable: /bin/zsh
  when: keyboard_input_sources.rc != 0

