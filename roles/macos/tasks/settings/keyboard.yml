- name: "Keyboard: wait interval before starting to repeat the key"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "InitialKeyRepeat"
    type: int
    value: 25

- name: "Keyboard: repeat key interval"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "KeyRepeat"
    type: int
    value: 5

- name: "Keyboard: don't add period with double space"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "NSAutomaticPeriodSubstitutionEnabled"
    type: bool
    value: false

- name: "Keyboard: read symbolic hotkeys"
  ansible.builtin.command:
    argv:
      - /usr/libexec/PlistBuddy
      - -c
      - "Print :AppleSymbolicHotKeys:{{ item.id }}:{{ item.path }}"
      - "{{ ansible_env.HOME }}/Library/Preferences/com.apple.symbolichotkeys.plist"
  loop: "{{ keyboard.symbolic_hotkeys }}"
  loop_control:
    label: "{{ item.name }}"
  register: keyboard_hotkeys_current
  changed_when: false
  failed_when: false

- name: "Keyboard: apply symbolic hotkeys"
  ansible.builtin.command:
    argv:
      - /usr/libexec/PlistBuddy
      - -c
      - "Set :AppleSymbolicHotKeys:{{ item.item.id }}:{{ item.item.path }} {{ item.item.value }}"
      - "{{ ansible_env.HOME }}/Library/Preferences/com.apple.symbolichotkeys.plist"
  loop: "{{ keyboard_hotkeys_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: (item.stdout | trim) not in item.item.accepted

