- name: "Keyboard: wait interval before starting to repeat the key"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "InitialKeyRepeat"
    type: int
    value: 25

- name: "Keyboard: repeat key interval"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "KeyRepeat"
    type: int
    value: 5

- name: "Keyboard: don't add period with double space"
  osx_defaults:
    domain: "NSGlobalDomain"
    key: "NSAutomaticPeriodSubstitutionEnabled"
    type: bool
    value: false

- name: "Keyboard: hotkeys"
  osx_defaults:
    domain: "com.apple.symbolichotkeys"
    key: "AppleSymbolicHotKeys"
    type: dict
    dict_mode: add
    value: "{{ keyboard.symbolic_hotkeys }}"

- name: "Keyboard: set the input sources"
  osx_defaults:
    domain: "com.apple.HIToolbox"
    key: "AppleEnabledInputSources"
    type: array
    value: "{{ keyboard.input_sources }}"

- name: "Keyboard: use globe key to show emoji panel"
  osx_defaults:
    domain: "com.apple.HIToolbox"
    key: "AppleFnUsageType"
    type: int
    value: 2
