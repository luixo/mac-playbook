- name: Set EDITOR in crontab
  ansible.builtin.cron:
    name: EDITOR
    env: true
    job: /bin/zsh

- name: Ensure a job to update oh-my-zsh exists
  ansible.builtin.cron:
    name: "update oh-my-zsh"
    minute: "0"
    hour: "*/2"
    job: "yes | omz update"

- name: Ensure a job to cleanup DS files
  ansible.builtin.cron:
    name: "cleanup DS files"
    minute: "0"
    hour: "*/2"
    job: "cleanup"
