---
- name: Tap Homebrew repos
  community.general.homebrew_tap:
    name: "{{ item }}"
    trust: true
  loop:
    - localsend/localsend
    - garethgeorge/homebrew-backrest-tap
    - domt4/autoupdate
    - anomalyco/tap

- name: Install Homebrew apps
  community.general.homebrew:
    name: "{{ item }}"
  loop:
    - deno
    - pinentry-mac
    - powerlevel10k
    - jq
    - docker-credential-helper
    - git
    - gpg
    - pam-reattach
    - imagemagick
    - exiftool
    - fnm
    - mas
    - backrest
    - bun
    - ffmpeg
    - openjdk
    - openjdk@21
    - postgresql@18
    - opencode
    - restic
    - utiluti
    - displayplacer
    - rust

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    sudo_password: "{{ ansible_become_password | default(omit) }}"
  loop:
    - iterm2
    - visual-studio-code
    - docker
    - google-chrome
    - thebrowsercompany-dia
    - datagrip
    - mounty
    - whisky
    - folx
    - notion
    - zoom
    - telegram
    - elmedia-player
    - git-credential-manager
    - slack
    - tailscale-app
    - daisydisk
    - openchamber
    - android-studio
    - firefox
    - hoppscotch
    - android-platform-tools
    - zulu@17
    - happ
    - setshot

- name: Clear the download quarantine flag from installed apps
  ansible.builtin.shell: |
    set -eu
    for app in /Applications/*.app; do
      xattr -p com.apple.quarantine "$app" >/dev/null 2>&1 || continue
      if xattr -dr com.apple.quarantine "$app"; then
        echo "$app"
      else
        echo "could not clear the quarantine flag on $app" >&2
      fi
    done
  register: quarantine_cleared
  changed_when: quarantine_cleared.stdout | length > 0
