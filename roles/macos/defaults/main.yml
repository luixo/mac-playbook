playbook:
  owner: "{{ owner }}"
  repo: "mac-playbook"
dockitems_persist:
  - name: Dia
    path: /Applications/Dia.app/
    pos: 1
  - name: Telegram
    path: /Applications/Telegram.app/
    pos: 2
  - name: iTerm
    path: /Applications/iTerm.app/
    pos: 3
  - name: Visual Studio Code
    path: /Applications/Visual Studio Code.app/
    pos: 4
  - name: Activity Monitor
    path: /System/Applications/Utilities/Activity Monitor.app/
    pos: 5
  - name: System Settings
    path: /System/Applications/System Settings.app/
    pos: 6
  - name: Slack
    path: /Applications/Slack.app/
    pos: 7
  - name: Calendar
    path: /System/Applications/Calendar.app/
    pos: 8
  - name: OpenChamber
    path: /Applications/OpenChamber.app/
    pos: 9
  - name: Notes
    path: /System/Applications/Notes.app/
    pos: 10
launchd_prefix: me.luixo
launchd_jobs:
  - label: omz-update
    command: "ZSH=\"$HOME/.oh-my-zsh\" zsh -f \"$HOME/.oh-my-zsh/tools/upgrade.sh\""
  - label: cleanup-ds
    command: "cleanup"
keyboard:
  symbolic_hotkeys:
    # 'next input source'
    60:
      value:
        parameters: [32, 49, 1048576]
    # 'previous input source'
    61:
      value:
        parameters: [32, 49, 1572864]
    # disable 'open spotlight'
    64:
      enabled: false
    # disable 'open finder'
    65:
      enabled: false
    # disable 'quick note'
    190:
      enabled: false
  input_sources:
    - "InputSourceKind": "Keyboard Layout"
      "KeyboardLayout ID": 252
      "KeyboardLayout Name": "ABC"
    - "InputSourceKind": "Keyboard Layout"
      "KeyboardLayout ID": 19458
      "KeyboardLayout Name": "RussianWin"
